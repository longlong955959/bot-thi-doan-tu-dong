name: Tự Động Săn Đề & Bắn Messenger

on:
  schedule:
    - cron: '30 0,6 * * *' # Chạy 7:30 sáng và 13:30 chiều hàng ngày
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_APPSTATE: ${{ secrets.FB_APPSTATE }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          WEB_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: node bot.js
      - run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add last_quiz.txt data.json de_cuong.txt || true
          git diff --staged --quiet || git commit -m "Cập nhật dữ liệu tự động"
          git push
