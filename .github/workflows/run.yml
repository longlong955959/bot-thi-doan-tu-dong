name: Doan Quiz Bot

on:
  schedule:
    - cron: "30 0 * * *"   # 07:30 GMT+7
    - cron: "30 6 * * *"   # 13:30 GMT+7
  workflow_dispatch:
    inputs:
      scan_all:
        description: "Quét tất cả cuộc thi 30 ngày gần nhất"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: doan-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_APPSTATE: ${{ secrets.FB_APPSTATE }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCAN_ALL: ${{ github.event.inputs.scan_all == 'true' }}
        run: node bot.js

      - name: Commit & push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data.json last_quiz.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "chore: cập nhật đáp án $(TZ=Asia/Ho_Chi_Minh date +'%d/%m %H:%M')"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "Push thất bại sau 3 lần thử"; exit 1; }
